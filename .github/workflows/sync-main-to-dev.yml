name: Sync main to dev

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-main-dev-${{ github.repository }}
  cancel-in-progress: true

jobs:
  ensure-sync-pr:
    name: Ensure sync/main-to-dev PR exists
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.ref_name == 'main'
    outputs:
      sync_needed: ${{ steps.check.outputs.sync_needed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reset sync branch and create or update PR
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [ -n "${GH_TOKEN:-}" ] || { echo "GH_TOKEN is empty"; exit 1; }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main dev

          if [ -z "$(git diff origin/dev...origin/main)" ]; then
            echo "dev already has all changes from main. Nothing to sync."
            echo "sync_needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "sync_needed=true" >> "$GITHUB_OUTPUT"

          if git ls-remote --exit-code origin sync/main-to-dev > /dev/null 2>&1; then
            extra_commits="$(git log origin/main..origin/sync/main-to-dev --oneline | wc -l | tr -d ' ')"
            if [ "$extra_commits" -gt 0 ]; then
              echo "sync/main-to-dev has $extra_commits resolution commit(s). Attempting to merge new main commits into it."
              git checkout -B sync/main-to-dev origin/sync/main-to-dev
              if git merge origin/main --no-edit; then
                git push origin sync/main-to-dev
                echo "Updated sync/main-to-dev with latest main commits, resolution work preserved."
              else
                echo "Could not merge new main into resolution branch. Resetting sync/main-to-dev."
                git merge --abort
                git checkout -B sync/main-to-dev origin/main
                git push origin sync/main-to-dev --force
                echo "Reset sync/main-to-dev to origin/main."

                reset_pr="$(gh pr list \
                  --repo "$REPO" \
                  --base dev \
                  --head sync/main-to-dev \
                  --state open \
                  --json number \
                  --jq '.[0].number // empty')"

                if [ -n "$reset_pr" ]; then
                  gh pr comment \
                    --repo "$REPO" \
                    "$reset_pr" \
                    --body "⚠️ A new push to \`main\` introduced additional conflicts that could not be auto-merged into this resolution branch. The \`sync/main-to-dev\` branch has been reset to \`main\`. Any in-progress resolution work has been lost — please resolve conflicts again from scratch."
                fi
              fi
            else
              git checkout -B sync/main-to-dev origin/main
              git push origin sync/main-to-dev --force
              echo "Reset sync/main-to-dev to origin/main."
            fi
          else
            git checkout -B sync/main-to-dev origin/main
            git push origin sync/main-to-dev --force
            echo "Created sync/main-to-dev from origin/main."
          fi

          pr_number="$(gh pr list \
            --repo "$REPO" \
            --base dev \
            --head sync/main-to-dev \
            --state open \
            --json number \
            --jq '.[0].number // empty')"

          if [ -z "$pr_number" ]; then
            gh pr create \
              --repo "$REPO" \
              --base dev \
              --head sync/main-to-dev \
              --title "chore: sync main into dev" \
              --body "Automated PR to keep \`dev\` up to date with \`main\`."
            echo "Created new sync PR."
          else
            gh pr edit \
              --repo "$REPO" \
              "$pr_number" \
              --title "chore: sync main into dev" \
              --body "Automated PR to keep \`dev\` up to date with \`main\`."
            echo "Updated existing sync PR #$pr_number."
          fi

  triage-conflicts:
    name: Triage merge conflicts
    needs: ensure-sync-pr
    runs-on: ubuntu-latest
    if: (github.event_name == 'workflow_dispatch' || github.ref_name == 'main') && needs.ensure-sync-pr.outputs.sync_needed == 'true'
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect conflicts and tag likely authors
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [ -n "${GH_TOKEN:-}" ] || { echo "GH_TOKEN is empty"; exit 1; }

          pr_number="$(gh pr list \
            --repo "$REPO" \
            --base dev \
            --head sync/main-to-dev \
            --state open \
            --json number \
            --jq '.[0].number // empty')"

          if [ -z "$pr_number" ]; then
            echo "No open sync/main-to-dev -> dev PR found. Nothing to triage."
            exit 0
          fi

          mergeable_state=""
          for _ in 1 2 3 4 5 6; do
            mergeable_state="$(gh api "repos/$REPO/pulls/$pr_number" --jq '.mergeable_state // "unknown"')"
            if [ "$mergeable_state" != "unknown" ]; then
              break
            fi
            sleep 5
          done

          if [ "$mergeable_state" = "clean" ] || [ "$mergeable_state" = "unstable" ]; then
            echo "PR #$pr_number is clean. Auto-merging sync PR."
            gh pr merge "$pr_number" \
              --repo "$REPO" \
              --merge \
              --subject "chore: auto-merge main into dev (no conflicts)"
            exit 0
          fi

          if [ "$mergeable_state" != "dirty" ]; then
            echo "PR #$pr_number is mergeable_state=$mergeable_state. Skipping auto-merge and conflict triage."
            exit 0
          fi

          git fetch origin main dev
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B conflict-check origin/dev

          if git merge --no-commit --no-ff origin/main; then
            echo "GitHub reports dirty but local merge succeeded. Skipping conflict comment."
            git merge --abort || true
            exit 0
          fi

          conflict_files="$(git diff --name-only --diff-filter=U || true)"
          git merge --abort || true

          if [ -z "$conflict_files" ]; then
            echo "No conflicted files found from local merge simulation."
            exit 0
          fi

          mention_file="$(mktemp)"
          files_block=""

          while IFS= read -r file; do
            [ -z "$file" ] && continue
            files_block="${files_block}- \`$file\`"$'\n'

            dev_login="$(gh api \
              "repos/$REPO/commits?sha=dev&path=$file&per_page=1" \
              --jq '.[0].author.login // empty' 2>/dev/null || true)"

            if [ -n "$dev_login" ]; then echo "$dev_login" >> "$mention_file"; fi
          done <<< "$conflict_files"

          mentions="$(sort -u "$mention_file" | sed 's/^/@/' | tr '\n' ' ')"
          rm -f "$mention_file"

          if [ -z "$mentions" ]; then
            mentions="_No GitHub authors could be inferred automatically._"
          fi

          body_file="$(mktemp)"
          {
            echo "⚠️ Sync check found merge conflicts between \`main\` and \`dev\`."
            echo ""
            echo "**Conflicted files:**"
            echo "$files_block"
            echo "**Likely contributors to review:**"
            echo "$mentions"
            echo ""
            echo "**What to do next**"
            echo "1. Checkout \`sync/main-to-dev\` branch locally."
            echo "2. Resolve the conflicted files listed above."
            echo "3. Run tests/build and verify behavior."
            echo "4. Push the conflict-resolution commit to this PR."
            echo "5. Merge this PR after approval."
            echo ""
            echo "**Notes**"
            echo "- Mentions are best-effort based on recent commits on \`dev\`."
            echo "- If you are not the owner, please reassign to the correct file owner."
            echo ""
            echo "Goal: keep \`dev\` aligned with \`main\` without regressions."
          } > "$body_file"

          gh pr comment \
            --repo "$REPO" \
            "$pr_number" \
            --body-file "$body_file"
          rm -f "$body_file"
